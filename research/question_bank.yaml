# Question bank: the seed intake form (form v1). The reviewer agent rewrites it over generations.
# Every question is optional for the renter; a skip is signal, not an error.
#
# Fields per question:
#   id       stable snake_case id. Reaction logs key on it across form versions, so don't rename
#            an id once runs exist; add a new question instead.
#   text     what the renter sees. Keep it friendly and plain.
#   type     number | select | multiselect | text | yesno
#   options  required for select and multiselect. Use the listing values from formloop/src/types.ts
#            (NOISE, LAYOUTS, LAUNDRY, PETS, NEIGHBORHOODS) where the question maps to those fields.
#   maps_to  listing fields this question informs (one or more of: price, neighborhood, bedrooms,
#            sqft, available, floor, layout, laundry, parking, pets, street_noise, commute).
#            Ablation drops a question's answers to measure what it was worth.
#   help     optional hint shown under the question.
#
# Run `cd formloop && npm run validate` after editing; errors name the file and the question id.

questions:
  - id: budget
    text: What's your monthly budget, and how firm is it?
    type: text
    maps_to: [price]
    help: 'e.g. "$3,200, could stretch to $3,500 for the right place"'

  - id: commute
    text: Where do you go most days, and how do you get there?
    type: text
    maps_to: [commute]
    help: 'e.g. "FiDi, Muni, under 30 minutes" or "Caltrain to Palo Alto"'

  - id: bedrooms
    text: How many bedrooms do you need? (Or tell us who's moving in.)
    type: select
    options: [studio, '1', '2', '3+']
    maps_to: [bedrooms]

  - id: move_in
    text: When would you like to move in?
    type: text
    maps_to: [available]
    help: 'A date or a window, e.g. "early December" or "anytime before Feb 1"'

  - id: last_place_gripe
    text: What's the one thing you hated about your last place?
    type: text
    maps_to: [street_noise, laundry, layout, floor]
    help: Noise, no laundry, a weird layout, too many stairs... anything counts.

  - id: pets
    text: Any pets moving in with you?
    type: select
    options: [cats, dogs, both, none]
    maps_to: [pets]

  - id: laundry
    text: What laundry setup works for you?
    type: select
    options: [in_unit, in_building, none]
    maps_to: [laundry]
    help: '"none" means you are fine without laundry on site.'

  - id: parking
    text: Do you need a parking spot?
    type: yesno
    maps_to: [parking]

  - id: street_noise
    text: Do you want a quiet street or a lively one?
    type: select
    options: [quiet, moderate, lively]
    maps_to: [street_noise]

  - id: floor
    text: Any floor preference?
    type: select
    options: [ground, low (2-3), high (4+), no preference]
    maps_to: [floor]

  - id: layout
    text: Which layouts would work for you?
    type: multiselect
    options: [standard, open, railroad, loft, irregular]
    maps_to: [layout]
    help: Railroad = rooms in a line, often walk-through bedrooms.

  - id: never_neighborhoods
    text: Any neighborhoods you'd never consider?
    type: multiselect
    options:
      - Mission
      - SoMa
      - Hayes Valley
      - Nob Hill
      - Pacific Heights
      - Marina
      - Inner Sunset
      - Outer Sunset
      - Inner Richmond
      - Outer Richmond
      - Noe Valley
      - Castro
      - Bernal Heights
      - Potrero Hill
      - Dogpatch
      - Tenderloin
      - North Beach
      - Russian Hill
      - Lower Haight
      - Excelsior
    maps_to: [neighborhood]
